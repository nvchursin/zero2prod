databases:
  - engine: PG
    name: newsletter
    num_nodes: 1
    size: db-s-dev-database
    version: '18'
ingress:
  rules:
    - component:
        name: zero2prod
      match:
        path:
          prefix: /
name: zero2prod
region: sgp
services:
  - dockerfile_path: Dockerfile
    envs:
      - key: APP_APPLICATION__HMAC_SECRET
        scope: RUN_TIME
        type: SECRET
        value: CzQGZ9akT8egSaHkdhkyKCTO3tJxPJdG99ltPsXQF+M=
      - key: APP_EMAIL_CLIENT__AUTHORIZATION_TOKEN
        scope: RUN_TIME
        type: SECRET
        value: EV[1:lrZjGmLkn21MXF/cT7f+ZDaiT6cEOVZI:+k7gf/UC2g637Wor5RSgHJU/9e+qwzeWrhBToX+YflhffMgj8/lugk9dGloQM4SF9jMjHA==]
      - key: APP_APPLICATION__BASE_URL
        scope: RUN_TIME
        value: ${APP_URL}
      - key: APP_DATABASE__USERNAME
        scope: RUN_TIME
        value: ${newsletter.USERNAME}
      - key: APP_DATABASE__PASSWORD
        scope: RUN_TIME
        value: ${newsletter.PASSWORD}
      - key: APP_DATABASE__HOST
        scope: RUN_TIME
        value: ${newsletter.HOSTNAME}
      - key: APP_DATABASE__PORT
        scope: RUN_TIME
        value: ${newsletter.PORT}
      - key: APP_DATABASE__DATABASE_NAME
        scope: RUN_TIME
        value: ${newsletter.DATABASE}
    github:
      branch: master
      deploy_on_push: true
      repo: nvchursin/zero2prod
    health_check:
      http_path: /healthz
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    name: zero2prod
    source_dir: .
