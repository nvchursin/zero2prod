[package]
name = "zero2prod"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-session = { version = "0.11.0", features = ["redis-session-rustls"] }
actix-web = "4.13.0"
actix-web-flash-messages = { version = "0.5.0", features = ["cookies"] }
anyhow = "1.0.103"
argon2 = { version = "0.5.3", features = ["std"] }
base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
claym = "0.6.0"
config = "0.15.24"
dotenvy = "0.15.7"
fake = "5.1.0"
hex = "0.4.3"
hmac = "0.13.0"
htmlescape = "0.3.1"
rand = "0.10.1"
reqwest = { version = "0.13.4", features = ["json", "form", "cookies"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_urlencoded = "0.7.1"
serde_with = "3.21.0"
sha2 = "0.11.0"
sha3 = "0.12.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "macros", "postgres", "uuid", "chrono", "migrate"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-actix-web = "0.7.22"
tracing-bunyan-formatter = "0.3.10"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-segmentation = "1.13.3"
urlencoding = "2.1.3"
uuid = { version = "1.23.3", features = ["v4", "serde"] }
validator = "0.20.0"
wiremock = "0.6.5"

[lib]
path = "src/lib.rs"

[[bin]]
name = "zero2prod"
path = "src/main.rs"

[dev-dependencies]
linkify = "0.11.0"
serde_json = "1.0.150"
password-hash = { version = "0.5", features = ["getrandom"] }
